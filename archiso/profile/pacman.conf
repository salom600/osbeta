#
# /etc/pacman.conf for NexoraOS live ISO build
# --------------------------------------------
# Used by archiso/mkarchiso to bootstrap the live root.
# Repos: core, extra, multilib (for gaming / 32-bit). AUR is NOT a binary repo
# and is fetched at runtime by yay/paru inside the live session.
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
# Disable disk-space check inside the chroot for reliability in CI:
# (re-enable after build if needed)
# NoExtract   = usr/share/man/* usr/share/doc/*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR — prebuilt binary cache for many AUR packages (games, code, etc.)
# Disabled by default to avoid hard dependency on third-party infra; uncomment
# to enable in custom builds.
#[chaotic-aur]
#Include = /etc/pacman.d/chaotic-mirrorlist
