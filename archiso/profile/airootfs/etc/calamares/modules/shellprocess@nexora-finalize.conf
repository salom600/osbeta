---
# Calamares shellprocess module — nexora-finalize
# Runs a script inside the chroot after packages are installed.
# We use this to:
#   - Enable services on the target system
#   - Seed /etc/skel into the new user's home
#   - Apply NexoraOS branding to /etc/os-release
#   - Record install metadata
#
# dontChroot: false → commands run INSIDE /target (the new system's root).
# So `chroot /target ...` would be WRONG here.

dontChroot: false
timeout: 600

script:
  - "systemctl enable NetworkManager lightdm bluetooth systemd-timesyncd haveged udisks2 polkit"
  - "cp -r /usr/local/bin/nexora-* /usr/local/bin/ 2>/dev/null || true"
  - "echo \"NexoraOS installed via Calamares on $(date)\" > /var/log/nexora-install.log"
  - "echo \"Build: ${ISO_VERSION:-unknown}\" >> /var/log/nexora-install.log"
