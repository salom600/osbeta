# Calamares packages module — NexoraOS
#
# This runs inside the chroot of the freshly-unpacked system.
# We re-synchronize pacman and ensure the NexoraOS core packages are present.
# The package list here mirrors archiso/profile/packages.x86_64 minus the
# build-only stuff (archiso, mkinitcpio-archiso, etc.).

backend: pacman

skip_this: false

update_db: true
update_system: false

operations:
  - install:
      - base
      - base-devel
      - linux
      - linux-headers
      - linux-firmware
      - systemd
      - systemd-sysvcompat
      - pacman
      - pacman-contrib
      - archlinux-keyring
      - haveged
      - intel-ucode
      - amd-ucode
      - grub
      - efibootmgr
      - os-prober
      - mkinitcpio
      - networkmanager
      - bluez
      - bluez-utils
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - mesa
      - vulkan-radeon
      - vulkan-intel
      - xf86-video-amdgpu
      - xf86-video-ati
      - xf86-video-intel
      - xf86-video-nouveau
      - xf86-video-vesa
      - xorg-server
      - xorg-xinit
      - openbox
      - lightdm
      - lightdm-gtk-greeter
      - gtk3
      - python
      - python-gobject
      - python-psutil
      - pcmanfm-gtk3
      - lxterminal
      - firefox
      - vim
      - nano
      - git
      - yay
      - htop
      - btop
      - neofetch
      - fastfetch
      - calamares
