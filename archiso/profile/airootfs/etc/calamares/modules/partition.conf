# Calamares partition module — NexoraOS
#
# Default filesystem: btrfs (snapshots via snapper).
# Users can pick ext4/xfs in the manual partitioning UI too.

userSwapChoices:
  - none
  - small
  - suspend
  - file

alwaysShowPartitionLabels: true

initialSwapChoice: none

initialFileSystemChoice: btrfs

availableFileSystems: [ btrfs, ext4, xfs, f2fs, jfs, reiserfs ]

defaultFileSystemType: btrfs

enableLuksAutomatedPartitioning: true

allowManualPartitioning: true

partitionLayout:
  - name: "boot"
    filesystem: ext4
    mountPoint: /boot
    size: 1G
    minSize: 512M
  - name: "root"
    filesystem: btrfs
    mountPoint: /
    size: 100%
    minSize: 10G

luksGeneration: luks1
