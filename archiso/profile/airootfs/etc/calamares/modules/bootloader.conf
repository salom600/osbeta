# Calamares bootloader module — NexoraOS
# Installs GRUB to the target disk for both BIOS and UEFI systems.

efiBootLoader: "grub"
kernelLine: "[domU]"
fallbackKernelLine: "[domU-fallback]"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootloaderId: "NexoraOS"
installBootloader: true
