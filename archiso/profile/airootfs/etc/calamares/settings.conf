# Calamares main settings file for NexoraOS
# ------------------------------------------
# Controls which modules run, in what order, and which branding is used.
# Only modules shipped with calamares + calamares-extensions are listed.

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksopenswaphookcfg
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - bootloader
      - shellprocess@nexora-finalize
  - show:
      - finished

branding: nexora

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-button: false

quit-at-end: false
