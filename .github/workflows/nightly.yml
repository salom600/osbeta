name: Nightly rebuild

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  trigger-kernel:
    name: Trigger kernel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Build custom kernel workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Build custom kernel" \
            --ref "${{ github.ref_name }}"

  trigger-iso:
    name: Trigger ISO build (after kernel)
    needs: trigger-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait 60s for kernel workflow to register
        run: sleep 60
      - name: Trigger Build NexoraOS ISO workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Build NexoraOS ISO" \
            --ref "${{ github.ref_name }}" \
            -f version_tag="nightly-$(date +%Y%m%d)" \
            -f make_release=false \
            -f use_custom_kernel=true
      - name: Capture run URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          echo "Latest ISO run:"
          gh run list --workflow="Build NexoraOS ISO" --limit=1 --json databaseId,url --jq '.[0] | "  \(.url)"'
