name: Build NexoraOS ISO

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for the release (e.g. 2026.1-beta1)'
        required: false
        default: ''
      make_release:
        description: 'Create GitHub release with the ISO attached'
        type: boolean
        required: false
        default: false
      use_custom_kernel:
        description: 'Download and use the latest custom kernel from the kernel workflow'
        type: boolean
        required: false
        default: true

env:
  ISO_NAME: nexora
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  build:
    name: Build ISO (Debian live-build, BIOS + UEFI)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
      issues: write

    outputs:
      version: ${{ steps.ver.outputs.version }}
      iso_path: ${{ steps.build.outputs.iso_path }}
      size_mb: ${{ steps.size.outputs.size_mb }}
      uploadable: ${{ steps.size.outputs.uploadable }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get -y purge azure-cli ghc* google* dotnet* powershell temurin-* mono-devel ruby-full || true
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          df -h /

      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            V="${{ inputs.version_tag }}"
          else
            V="$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "iso_label=NEXORA_$(date +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Install live-build + dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debian-archive-keyring squashfs-tools xorriso \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools wget curl jq

      - name: Download latest custom kernel .deb (optional)
        if: ${{ inputs.use_custom_kernel == true || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          mkdir -p work/kernel-out
          # Find the latest successful kernel workflow run
          echo "==> Looking for latest kernel build..."
          KERNEL_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-kernel.yml/runs?status=success&per_page=5" \
            | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$KERNEL_RUN_ID" ]; then
            echo "No successful kernel build found. Will fall back to Debian stock kernel."
          else
            echo "==> Found kernel run ID: $KERNEL_RUN_ID"
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$KERNEL_RUN_ID/artifacts" \
              | jq -r '.artifacts[] | select(.name | startswith("nexora-kernel-")) | .archive_download_url' | head -1)
            if [ -n "$ARTIFACT_URL" ]; then
              echo "==> Downloading kernel artifact..."
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -o kernel-artifact.zip "$ARTIFACT_URL"
              unzip -o kernel-artifact.zip -d work/kernel-out/
              rm kernel-artifact.zip
              echo "==> Custom kernel packages:"
              ls -lh work/kernel-out/*.deb
            fi
          fi

      - name: Build ISO via live-build
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ISO_LABEL: ${{ steps.ver.outputs.iso_label }}
        run: |
          set -euo pipefail
          mkdir -p out

          # Build inside a docker container so we have a clean Debian environment
          # for live-build (which expects apt sources to work).
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            --privileged \
            -e VERSION="$VERSION" \
            -e ISO_LABEL="$ISO_LABEL" \
            debian:trixie \
            bash -euo pipefail -c '
              echo "==> Installing live-build in container..."
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debian-archive-keyring sudo wget curl xorriso \
                squashfs-tools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates

              echo "==> Building NexoraOS ISO via live-build..."
              cd /work
              VERSION="$VERSION" ISO_NAME="nexora" ISO_LABEL="$ISO_LABEL" \
                ./debian-live/build.sh 2>&1 | tee out/build.log
            '

          ISO_FILE=$(ls out/*.iso 2>/dev/null | head -1 || true)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO produced. Build log:"
            tail -100 out/build.log
            exit 1
          fi
          echo "iso_path=$ISO_FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$ISO_FILE" > "$ISO_FILE.sha256sum"
          echo "iso_sha_path=$ISO_FILE.sha256sum" >> "$GITHUB_OUTPUT"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-iso-${{ steps.ver.outputs.version }}
          path: |
            out/*.iso
            out/*.iso.sha256sum
            out/build.log
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0

      - name: Check ISO size against GitHub release limit
        id: size
        run: |
          ISO="${{ steps.build.outputs.iso_path }}"
          SIZE_BYTES=$(stat -c %s "$ISO")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          if [ "$SIZE_BYTES" -lt 2147483648 ]; then
            echo "uploadable=true" >> "$GITHUB_OUTPUT"
            echo "ISO is ${SIZE_MB} MB — under 2 GiB limit, will upload to release."
          else
            echo "uploadable=false" >> "$GITHUB_OUTPUT"
            echo "ISO is ${SIZE_MB} MB — exceeds 2 GiB GitHub release limit."
            echo "Available as CI artifact (10 GB limit, 30-day retention)."
          fi

      - name: Compose release notes
        id: notes
        run: |
          cat > /tmp/release-notes.md <<EOF
          # NexoraOS ${{ steps.ver.outputs.version }}

          Automated build from commit \`${{ github.sha }}\`.

          **ISO size:** ${{ steps.size.outputs.size_mb }} MB
          **Base:** Debian 13 (Trixie) + NexoraDE
          **Boot:** hybrid BIOS + UEFI

          ## Download
          EOF
          if [ "${{ steps.size.outputs.uploadable }}" = "true" ]; then
            echo "- \`nexora-${{ steps.ver.outputs.version }}-amd64.iso\` — bootable hybrid ISO (BIOS + UEFI)" >> /tmp/release-notes.md
          else
            echo "- ⚠ **ISO NOT attached** — exceeds GitHub's 2 GiB asset limit." >> /tmp/release-notes.md
            echo "  Download it from the [Actions workflow run page](https://github.com/salom600/osbeta/actions/runs/${{ github.run_id }}) instead (CI artifact, 30-day retention)." >> /tmp/release-notes.md
          fi
          cat >> /tmp/release-notes.md <<EOF
          - \`nexora-${{ steps.ver.outputs.version }}-amd64.iso.sha256sum\` — checksum
          - \`build.log\` — full live-build log

          ## How to use
          1. Flash the ISO to a USB stick:
             \`\`\`bash
             sudo dd if=nexora-${{ steps.ver.outputs.version }}-amd64.iso of=/dev/sdX bs=4M status=progress conv=fsync
             \`\`\`
             Or use [balenaEtcher](https://etcher.balena.io/) / [Ventoy](https://www.ventoy.net).
          2. Boot from the USB stick (BIOS or UEFI).
          3. Click **Install NexoraOS** on the desktop to start the installer.

          ## Minimum specs
          - 1 GB RAM (low-RAM boot) / 2 GB recommended
          - 10 GB free disk space
          - x86_64 CPU (Intel/AMD from 2009+)
          - BIOS or UEFI

          ## What's preinstalled
          - NexoraDE (Openbox + Python/GTK3 panel, launcher, settings)
          - Firefox ESR, PCManFM, LXTerminal, Mousepad
          - VLC, mpv, GIMP
          - PipeWire audio, NetworkManager, Bluetooth
          - Full driver coverage (Intel/AMD/NVIDIA 2009+, VirtualBox/QEMU/VMware guest additions)
          - Nexora Store — install more apps from Debian repos
          - Custom Nexora kernel (Linux ${{ steps.ver.outputs.version }}-nexora1) when available
          EOF
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.make_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "NexoraOS ${{ steps.ver.outputs.version }}"
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.build.outputs.iso_sha_path }}
            out/build.log
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach ISO to release (only if under 2 GiB)
        if: ${{ steps.size.outputs.uploadable == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.make_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            ${{ steps.build.outputs.iso_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-failure:
    name: Open issue on failure
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Create labels if they don't exist
          for spec in "build-failure,d73a4a" "auto-fix,fbca04" "automated,bfdadc"; do
            name="${spec%%,*}"
            color="${spec##*,}"
            gh label create "$name" --color "$color" --description "Auto-applied by CI" --force 2>/dev/null || true
          done

          BODY=$(cat <<EOF
          ## 🚧 Build failure

          The **Build NexoraOS ISO** workflow failed.

          | Field | Value |
          |-------|-------|
          | Version | \`${VERSION:-unknown}\` |
          | Commit | \`${COMMIT_SHA}\` |
          | Message | \`\`\`${COMMIT_MSG}\`\`\` |
          | Run URL | [${RUN_ID}](${RUN_URL}) |

          ## What happens next

          The \`auto-fix\` workflow will pick up this issue automatically, parse the build log, and attempt a patch. If it can't fix the issue automatically it will post a comment with the root-cause analysis and a suggested fix.

          If you want to retry the build now, click here:
          [Re-run failed jobs](${RUN_URL})
          EOF
          )
          ISSUE_URL=$(gh issue create \
            --title "🚧 ISO Build failure on \`${COMMIT_SHA::7}\`" \
            --body "$BODY" \
            --label "build-failure" \
            --label "auto-fix" \
            --label "automated" \
            --assignee salom600)
          ISSUE_NUM="${ISSUE_URL##*/}"

          # Trigger the auto-fix workflow
          echo "==> Triggering auto-fix workflow for issue #$ISSUE_NUM"
          gh workflow run "Auto-fix Build Failures" \
            --ref "${{ github.ref_name }}" \
            -f issue_number="$ISSUE_NUM" || true
