name: Build custom kernel

on:
  push:
    branches: [ main, master ]
    paths:
      - 'kernel/**'
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:
    inputs:
      kver:
        description: 'Kernel version (e.g. 6.12.10)'
        required: false
        default: ''
  schedule:
    # Weekly kernel rebuild (catches new LTS releases)
    - cron: "0 4 * * 1"

permissions:
  contents: write
  actions: write

env:
  KVER_DEFAULT: "6.12.10"

jobs:
  build-kernel:
    name: Build Linux LTS kernel .deb (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Resolve kernel version
        id: kver
        run: |
          if [ -n "${{ inputs.kver }}" ]; then
            K="${{ inputs.kver }}"
          else
            K="${KVER_DEFAULT}"
          fi
          echo "version=$K" >> "$GITHUB_OUTPUT"
          echo "Building Linux $K"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get -y purge azure-cli ghc* google* dotnet* powershell temurin-* mono-devel ruby-full || true
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libelf-dev bc cpio kmod rsync wget \
            ccache debhelper flex bison libncurses-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-kernel-${{ steps.kver.outputs.version }}-${{ runner.os }}
          restore-keys: |
            ccache-kernel-${{ steps.kver.outputs.version }}-
            ccache-kernel-

      - name: Build kernel .deb packages
        id: build
        env:
          KVER: ${{ steps.kver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p work/kernel work/kernel-out
          KVER="${KVER}" ./kernel/build.sh

          # Verify output
          if ! ls work/kernel-out/*.deb >/dev/null 2>&1; then
            echo "ERROR: no .deb packages produced"
            exit 1
          fi
          echo "==> Built packages:"
          ls -lh work/kernel-out/

      - name: Save ccache stats
        run: |
          ccache -s || true

      - name: Upload kernel .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-kernel-${{ steps.kver.outputs.version }}
          path: work/kernel-out/*.deb
          retention-days: 30
          compression-level: 0

      - name: Create kernel release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-v${{ steps.kver.outputs.version }}
          name: "NexoraOS Kernel ${{ steps.kver.outputs.version }}"
          body: |
            # NexoraOS custom kernel — Linux ${{ steps.kver.outputs.version }}-nexora1

            Built from vanilla `linux-${{ steps.kver.outputs.version }}.tar.xz` with the NexoraOS `.config`:
            - 1000 Hz timer
            - Voluntary preemption
            - BFQ I/O scheduler
            - Schedutil CPU governor
            - All major GPU drivers as modules (Intel / AMD / NVIDIA-nouveau / VMware / VirtualBox)
            - BPF JIT, KSM, BBR TCP, WireGuard built-in
            - Module signature verification enabled

            ## Files
            - `linux-image-${{ steps.kver.outputs.version }}-nexora1_*.deb` — install this on the target system
            - `linux-headers-${{ steps.kver.outputs.version }}-nexora1_*.deb` — needed for DKMS module builds
            - `linux-libc-dev_*.deb` — kernel headers for libc

            ## Install
            ```bash
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb linux-libc-dev_*.deb
            sudo update-initramfs -u -k all
            sudo update-grub
            sudo reboot
            ```

            ## Build time
            ~45-90 min on a 4-core runner, less with ccache on rebuilds.
          files: work/kernel-out/*.deb
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
